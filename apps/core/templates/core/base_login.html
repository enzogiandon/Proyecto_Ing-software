<!-- templates/base_login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Sistema de Gestión y Administración de Envios{% endblock %}</title>
        <!-- Favicon -->
        <link rel="icon"
              type="image/x-icon"
              href="{% static 'core/img/favicon.ico' %}">
        <!-- FUENTE ROBOTO para Login -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
              rel="stylesheet">
        <!-- Fallback para fuentes locales -->
        <style>
        @font-face {
            font-family: 'Roboto-Local';
            src: url('{% static "core/fonts/Roboto-Regular.woff2" %}') format('woff2'),
                url('{% static "core/fonts/Roboto-Regular.woff" %}') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        </style>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <!-- Font Awesome actualizado -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
              rel="stylesheet"
              crossorigin="anonymous">
        <!-- CSS propio -->
        <link href="{% static 'core/css/paletas.css' %}" rel="stylesheet">
        <link href="{% static 'core/css/login.css' %}" rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/opendyslexic/0.91.0/css/OpenDyslexic.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
              rel="stylesheet">
    </head>
    <body class="py-4">
        <!-- Fondo partículas -->
        <div id="particles-js"></div>
        <div class="container">
            <div class="row justify-content-center">
                {% block content %}{% endblock %}
            </div>
        </div>
        <!-- Bootstrap Bundle con Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Particles.js -->
        <script type="module" src="{% static 'core/js/particles.js' %}"></script>
        <!-- Toast -->
        <script type="module" src="{% static 'core/js/toast.js' %}"></script>
    </body>
</html>
