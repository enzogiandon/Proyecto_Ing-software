<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test de Importación</title>
    <!-- Bootstrap para orden visual rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">

    <div class="container" style="max-width: 500px;">
        <h4 class="mb-3">Probar Subida de Archivo</h4>

        <!-- Mensajes del backend (éxito / error) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} py-2">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- FORMULARIO DIRECTO -->
        <form method="post" enctype="multipart/form-data" class="bg-white p-4 border rounded shadow-sm">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">Marca:</label>
                {{ form.marca }}
                {{ form.marca.errors }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Archivo:</label>
                {{ form.archivo }}
                {{ form.archivo.errors }}
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Subir Archivo
            </button>
        </form>
    </div>

</body>
</html>
