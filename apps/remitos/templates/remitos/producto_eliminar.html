<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light py-5">

<div class="container" style="max-width: 550px;">
    <div class="card shadow border-0">
        <div class="card-body p-4 text-center">
            <!-- Ícono de advertencia -->
            <div class="mb-3 text-danger">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 3.2rem;"></i>
            </div>

            <h4 class="card-title fw-bold text-dark mb-2">¿Dar de baja este producto?</h4>
            <p class="text-muted small mb-4">
                El producto dejará de estar disponible para nuevos remitos y pasará al final del catálogo como inactivo.
            </p>

            <!-- Resumen del Producto -->
            <div class="card bg-light border-0 text-start p-3 mb-4">
                <div class="row g-2 small">
                    <div class="col-5 text-muted">Producto:</div>
                    <div class="col-7 fw-bold text-end">{{ object.nombre }}</div>

                    <div class="col-5 text-muted">Código:</div>
                    <div class="col-7 text-end"><code>{{ object.codigo|default:"Sin código" }}</code></div>

                    <div class="col-5 text-muted">Marca:</div>
                    <div class="col-7 text-end">{{ object.marca.nombre|default:"Sin marca" }}</div>
                </div>
            </div>

            <!-- Formulario POST obligatorio para DeleteView -->
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'remitos:producto_lista' %}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4 shadow-sm">
                        <i class="bi bi-trash3 me-1"></i> Confirmar Baja
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
