<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso denegado | RepartoYA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FFF6EC;
            color: #1B1B1F;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .btn-naranja {
            background-color: #F4661B;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-naranja:hover {
            background-color: #d85714;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <main class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width: 500px; width: 100%; border-radius: 16px;">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background-color: #FFF6EC; border-radius: 50%;">
            <i class="fas fa-shield-halved fa-2x" style="color: #F4661B;"></i>
        </div>

        <span class="badge px-3 py-2 rounded-pill mx-auto mb-3" style="background-color: #FFF6EC; color: #123C6B; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px;">
            ERROR 403
        </span>

        <h1 class="fw-bold mb-2" style="color: #123C6B; font-size: 1.85rem;">Acceso no autorizado</h1>

        <p class="mb-4" style="color: #1B1B1F; font-size: 1rem; line-height: 1.5;">
            Tu cuenta no cuenta con los permisos o grupos requeridos para acceder a este módulo.
        </p>

        <div class="d-flex justify-content-center">
            <a href="{% url 'core:inicio' %}" class="btn btn-naranja px-4 py-2 d-inline-flex align-items-center gap-2">
                <i class="fas fa-arrow-left"></i>
                <span>Volver al panel</span>
            </a>
        </div>
    </main>
</body>
</html>
