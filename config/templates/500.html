<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Error del sistema | RepartoYA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FFF6EC;
            color: #1B1B1F;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .btn-naranja {
            background-color: #F4661B;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-naranja:hover {
            background-color: #d85714;
            color: #FFFFFF;
        }
        .btn-outline-azul {
            border: 1.5px solid #123C6B;
            color: #123C6B;
            border-radius: 8px;
            font-weight: 500;
            background: transparent;
        }
        .btn-outline-azul:hover {
            background-color: #123C6B;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <main class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width: 500px; width: 100%; border-radius: 16px;">
        <div class="mx-auto mb-3" style="width: 140px; height: 90px;">
            <svg viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-100 h-100">
                <!-- Alerta lateral -->
                <circle cx="20" cy="52" r="12" fill="#FFF6EC"/>
                <text x="20" y="58" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#F4661B" text-anchor="middle">!</text>

                <!-- Caja del camión (Azul Ruta) -->
                <path d="M36 30C36 25.58 39.58 22 44 22H101C105.42 22 109 25.58 109 30V72C109 74.2 107.2 76 105 76H40C37.8 76 36 74.2 36 72V30Z" fill="#123C6B"/>
                <text x="72" y="58" font-family="-apple-system, sans-serif" font-weight="900" font-size="27" fill="#F4661B" text-anchor="middle">YA</text>

                <!-- Cabina (Naranja YA) -->
                <path d="M109 40H124L138 58V72C138 74.2 136.2 76 134 76H109V40Z" fill="#F4661B"/>
                <path d="M113 45H122L132 58H113V45Z" fill="#FFFFFF"/>

                <!-- Ruedas -->
                <circle cx="60" cy="76" r="11" fill="#123C6B"/>
                <circle cx="60" cy="76" r="4.5" fill="#FFF6EC"/>
                <circle cx="122" cy="76" r="11" fill="#123C6B"/>
                <circle cx="122" cy="76" r="4.5" fill="#FFF6EC"/>
            </svg>
        </div>

        <span class="badge px-3 py-2 rounded-pill mx-auto mb-3" style="background-color: #FFF6EC; color: #F4661B; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px;">
            ERROR 500
        </span>

        <h1 class="fw-bold mb-2" style="color: #123C6B; font-size: 1.85rem;">Desperfecto en el sistema</h1>

        <p class="mb-4" style="color: #1B1B1F; font-size: 1rem; line-height: 1.5;">
            Ocurrió un error inesperado al procesar la solicitud en el servidor. El inconveniente ya fue registrado.
        </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <button onclick="window.location.reload()" class="btn btn-naranja px-4 py-2 d-inline-flex align-items-center justify-content-center gap-2">
                <i class="fas fa-rotate-right"></i>
                <span>Reintentar</span>
            </button>
            <a href="{% url 'core:inicio' %}" class="btn btn-outline-azul px-4 py-2 d-inline-flex align-items-center justify-content-center gap-2">
                <i class="fas fa-home"></i>
                <span>Panel principal</span>
            </a>
        </div>
    </main>
</body>
</html>
