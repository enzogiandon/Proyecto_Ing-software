<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - RepartosYA</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Propios -->
    <link href="apps/core/static/core/css/paletas.css" rel="stylesheet">
    <link href="apps/core/static/core/css/login.css" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <!-- ==============================================
             PANEL IZQUIERDO (AZUL CORPORATIVO FIGMA)
        =============================================== -->
        <section class="login-brand-panel">
            <div class="login-brand-box">
                <i class="fas fa-truck-fast"></i>
            </div>
            <h1 class="login-brand-title">RepartosYA</h1>
            <p class="login-brand-subtitle">Panel administrativo de distribución</p>
        </section>

        <!-- ==============================================
             PANEL DERECHO (FORMULARIO BLANCO FIGMA)
        =============================================== -->
        <section class="login-form-panel">
            <div class="login-form-card">
                <h2 class="login-form-title">Iniciar sesión</h2>
                <p class="login-form-subtitle">Ingresá con tu usuario y contraseña.</p>

                <!-- SELECTOR DE ESTADOS PARA DEMOSTRACIÓN FIGMA -->
                <div class="mb-3 p-2 bg-light rounded border d-flex gap-2 align-items-center small">
                    <span class="text-muted fw-bold">Probar estado:</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="setDemoState('normal')">Normal</button>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="setDemoState('error')">Error</button>
                    <button type="button" class="btn btn-sm btn-outline-warning py-0 px-2" onclick="setDemoState('warning')">Deshabilitada</button>
                </div>

                <!-- ALERTA DE ERROR / SUSPENSIÓN (DINÁMICA EN ESTA PREVIEW) -->
                <div id="demoAlert" class="login-alert d-none" role="alert">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span id="demoAlertText"></span>
                </div>

                <!-- FORMULARIO: Al enviar te redirige a la pantalla de Inicio que hicimos antes -->
                <form id="loginForm" action="preview.html" method="get">
                    <!-- CAMPO USUARIO -->
                    <div class="login-form-group">
                        <label for="id_username" class="login-label">Usuario</label>
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="login-input"
                               placeholder="Ingresá tu usuario"
                               value="admin"
                               required
                               autofocus>
                    </div>

                    <!-- CAMPO CONTRASEÑA -->
                    <div class="login-form-group">
                        <label for="id_password" class="login-label">Contraseña</label>
                        <div class="password-field-wrapper">
                            <input type="password"
                                   name="password"
                                   id="id_password"
                                   class="login-input"
                                   placeholder="Ingresá tu contraseña"
                                   value="password123"
                                   required>
                            <button type="button" class="btn-toggle-eye" id="togglePasswordBtn" aria-label="Mostrar u ocultar contraseña">
                                <i class="far fa-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- BOTÓN SUBMIT (CON ESTADO DE CARGA FIGMA) -->
                    <button type="submit" class="btn-login-submit" id="submitBtn">
                        <span id="btnText">Iniciar sesión</span>
                        <span id="btnLoading" class="d-none">
                            <i class="fas fa-rotate fa-spin me-2"></i>Ingresando...
                        </span>
                    </button>

                    <!-- ENLACE WHATSAPP -->
                    <div class="text-center mt-4">
                        <a href="https://wa.me/" target="_blank" class="login-help-link">
                            ¿Problemas para ingresar? Contactá al administrador por WhatsApp
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <!-- SCRIPT DEMO Y LÓGICA INTERACTIVA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('id_password');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');

            // Mostrar/Ocultar contraseña
            if (toggleBtn && passwordInput && toggleIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    toggleIcon.classList.toggle('fa-eye', !isPassword);
                    toggleIcon.classList.toggle('fa-eye-slash', isPassword);
                });
            }

            // Al darle a Iniciar sesión, mostrar "Ingresando..." y redirigir a la pantalla de Inicio
            if (loginForm && submitBtn) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    submitBtn.disabled = true;
                    if (btnText) btnText.classList.add('d-none');
                    if (btnLoading) btnLoading.classList.remove('d-none');

                    setTimeout(() => {
                        window.location.href = 'preview.html';
                    }, 800);
                });
            }
        });

        // Función para alternar los estados diseñados en Figma
        function setDemoState(state) {
            const alertBox = document.getElementById('demoAlert');
            const alertText = document.getElementById('demoAlertText');
            const usernameInput = document.getElementById('id_username');
            const passwordInput = document.getElementById('id_password');

            alertBox.className = 'login-alert';
            usernameInput.classList.remove('is-invalid');
            passwordInput.classList.remove('is-invalid');

            if (state === 'normal') {
                alertBox.classList.add('d-none');
            } else if (state === 'error') {
                alertBox.classList.remove('d-none');
                alertBox.classList.add('login-alert-danger');
                alertText.textContent = 'Usuario o contraseña incorrectos.';
                usernameInput.classList.add('is-invalid');
                passwordInput.classList.add('is-invalid');
            } else if (state === 'warning') {
                alertBox.classList.remove('d-none');
                alertBox.classList.add('login-alert-warning');
                alertText.textContent = 'Tu cuenta está deshabilitada. Contactá a un administrador.';
            }
        }
    </script>
</body>
</html>
